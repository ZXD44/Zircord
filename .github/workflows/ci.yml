name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Syntax Check Core Engine
      run: |
        node --check src/discord-rpc.js

    - name: Validate JSON Schemas and Presets
      run: |
        node -e "
          const fs = require('fs');
          JSON.parse(fs.readFileSync('zircord.json', 'utf8'));
          JSON.parse(fs.readFileSync('config/zircord.schema.json', 'utf8'));
          JSON.parse(fs.readFileSync('config/presets/thai.json', 'utf8'));
          JSON.parse(fs.readFileSync('config/presets/cyber.json', 'utf8'));
          JSON.parse(fs.readFileSync('config/presets/modern.json', 'utf8'));
          JSON.parse(fs.readFileSync('config/presets/roblox-dev.json', 'utf8'));
          console.log('All JSON files validated successfully.');
        "
